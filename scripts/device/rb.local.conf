# rb.local.conf — Machine-local overrides for Amlogic S905X (Armbian)
# Display: 1280x800 or 1024x600 32bpp HDMI with Capacitive Touch Panel (CTP)

# Presentation mode: convert for 1280x800 32bpp (1:1), or scale for 1024x600
RB_DFB_PRESENT=convert
RB_DFB_PRESENT_FIT=fit

# Framebuffer bpp: 32 (matches mesondrmfb 32bpp)
RB_FB_LIE_BPP=32

# Audio: Disable Pi VC4 HDMI raw subframe mirror
RB_AUDIO_MIRROR_DEV=""

# Pointer: Capacitive touch panel
RB_POINT_KIND=auto

# MIDI mapping & Audio: DDJ-FLX6
RB_MIDI_MAP=flx6
RB_AUDIO_DEV="hw:CARD=DDJFLX6,DEV=0"

# VNC Server & Touch Input (Amlogic S905X: raw mode avoids missing /dev/video11)
RB_VNC=1
RB_VNC_LIVE=on
RB_VNC_INPUT=1
RB_VNC_PASSWORD=""
RB_VNC_FPS=30
RB_VNC_MODE=raw

# Autostart rbp on boot
RB_AUTOSTART=1

# Jogwheel Sensitivity & Calibration (DDJ-FLX6)
# RB_JOG_SCALE: Multiplier posisi putaran vinyl/scratch (FLX6 720 ticks -> RX3 6480 pulses = skala ~8-9)
RB_JOG_SCALE=9
# RB_JOG_PPR: Pulses per rev untuk pitch bend / speed calculation (default 720)
RB_JOG_PPR=720
RB_JOG_IDLE_MS=100
RB_JOG_VERBOSE=1

# USB TEST Auto-mount (Virtual Rekordbox USB Media: /opt/rblive4/usb1_test.img)
RB_USB_TEST_AUTO=1

# Browse Mods
# RB_BROWSE_SONGINFO_REMEMBER: 1 = Remember Touch Preview / Song Info state across reboots
RB_BROWSE_SONGINFO_REMEMBER=1
# RB_BROWSE_HIDE_TRACKNO: 0 = Disabled (keeps native column layout and prevents overlap)
RB_BROWSE_HIDE_TRACKNO=0
# RB_BROWSE_SHIFT_LEFT_PX: 0 = No text shifting (native alignment)
RB_BROWSE_SHIFT_LEFT_PX=0
# RB_BROWSE_CAMELOT_KEY: 0 = Disabled / Reverted (uses native Rekordbox key display)
RB_BROWSE_CAMELOT_KEY=0


