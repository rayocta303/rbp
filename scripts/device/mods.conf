# XDJ-RX3 Mod System Configuration
# /opt/rblive4/mods.conf

# Master switch for librx3_core.so preload
MOD_CORE=1

# Harmonic Mixing (Key Shift & Key Sync & Camelot Match)
MOD_KEYSHIFT=1
MOD_KEY_SYNC=1
MOD_KEY_SYNC_RANGE=1
MOD_KEY_SYNC_MODE=identical
MOD_KEY_MATCH=1
MOD_KEY_MATCH_RULES=2

# Sound Color FX Dual Enhancement
MOD_COLORFX_DUAL=1

# 8-Pad Hardware Sampler & Stems
MOD_SAMPLES=1
MOD_STEMS=1
MOD_STEMS_LOCAL=0

# RMX-1000 Roll & Scene FX
MOD_RMX_ROLL=1
MOD_RMX_ROLL_MODE=aux
MOD_RMX_SCENE=1
MOD_RMX_SCENE_TYPE=hpf

# Beat Jump Modes
MOD_BEATJUMP_32BARS=1
MOD_BEATJUMP_CUSTOM=1
MOD_BEATJUMP_NO_QUANTIZE=1

# Display & Navigation
MOD_THEME_WHITE=1
MOD_THEME_MODE=s
MOD_BROWSE_COLUMNS=1
MOD_BROWSE_FIELD=13
MOD_BROWSE_LONGPRESS=1
MOD_SEARCH_LATIN=1
MOD_ASSHOLE_MODE=1
MOD_LOGO=0

# Live Broadcast / Stream
MOD_NOW_PLAYING=1
MOD_NET_ANNOUNCE=1

